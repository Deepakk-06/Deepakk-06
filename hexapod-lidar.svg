<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="sweepFade" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- grid floor -->
  <g stroke="#123047" stroke-width="1">
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="150" y1="240" x2="80" y2="320"/>
    <line x1="300" y1="240" x2="270" y2="320"/>
    <line x1="450" y1="240" x2="450" y2="320"/>
    <line x1="600" y1="240" x2="630" y2="320"/>
    <line x1="750" y1="240" x2="820" y2="320"/>
  </g>

  <!-- ===== LiDAR radar (top right) ===== -->
  <g transform="translate(730,95)">
    <circle r="80" fill="none" stroke="#0d3b4a" stroke-width="1.5"/>
    <circle r="55" fill="none" stroke="#0d3b4a" stroke-width="1"/>
    <circle r="28" fill="none" stroke="#0d3b4a" stroke-width="1"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#0d3b4a" stroke-width="1"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#0d3b4a" stroke-width="1"/>

    <!-- rotating sweep -->
    <g>
      <path d="M0,0 L80,0 A80,80 0 0,1 56.6,56.6 Z" fill="url(#sweepFade)"/>
      <line x1="0" y1="0" x2="80" y2="0" stroke="#00f7ff" stroke-width="2" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- detected point blips -->
    <circle cx="45" cy="-30" r="3" fill="#ff5d73">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-60" cy="20" r="3" fill="#ff5d73">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="70" r="3" fill="#ff5d73">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-40" cy="-55" r="3" fill="#ff5d73">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.2s" repeatCount="indefinite"/>
    </circle>

    <circle r="4" fill="#00f7ff" filter="url(#glow)"/>
    <text x="0" y="105" text-anchor="middle" fill="#5b8ca8" font-family="monospace" font-size="12">LiDAR scan · 360°</text>
  </g>

  <!-- ===== Hexapod (walking, center-left) ===== -->
  <g transform="translate(220,230)">
    <!-- body -->
    <rect x="-70" y="-22" width="140" height="34" rx="8" fill="#132a3a" stroke="#00f7ff" stroke-width="1.5"/>
    <circle cx="-45" cy="-5" r="3" fill="#00f7ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-5" r="3" fill="#00f7ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="-5" r="3" fill="#00f7ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- 6 legs: 3 per side, tripod gait (front+back on one side move with mid on other) -->
    <!-- RIGHT side legs (down stroke phase A) -->
    <g stroke="#00f7ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
      <line x1="55" y1="-10" x2="95" y2="35">
        <animateTransform attributeName="transform" type="rotate" values="0 55 -10;-18 55 -10;0 55 -10" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="20" y1="10" x2="20" y2="55">
        <animateTransform attributeName="transform" type="rotate" values="-18 20 10;0 20 10;-18 20 10" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-55" y1="-10" x2="-95" y2="35">
        <animateTransform attributeName="transform" type="rotate" values="0 -55 -10;18 -55 -10;0 -55 -10" dur="0.6s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- LEFT side legs (opposite phase) -->
    <g stroke="#0ea5c4" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
      <line x1="55" y1="10" x2="90" y2="50">
        <animateTransform attributeName="transform" type="rotate" values="-18 55 10;0 55 10;-18 55 10" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="20" y1="18" x2="15" y2="60">
        <animateTransform attributeName="transform" type="rotate" values="0 20 18;-18 20 18;0 20 18" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-55" y1="10" x2="-90" y2="50">
        <animateTransform attributeName="transform" type="rotate" values="-18 -55 10;0 -55 10;-18 -55 10" dur="0.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- subtle body bob -->
    <animateTransform attributeName="transform" type="translate" values="220,230;220,226;220,230" dur="0.6s" repeatCount="indefinite" additive="sum"/>
  </g>

  <text x="220" y="300" text-anchor="middle" fill="#5b8ca8" font-family="monospace" font-size="12">18-DOF tripod gait</text>

  <text x="30" y="30" fill="#00f7ff" font-family="monospace" font-size="15" filter="url(#glow)">sense → decide → move</text>
</svg>
